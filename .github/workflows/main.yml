name: Main Foodgram workflow

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_all:
        description: Build and deploy all services
        type: boolean
        default: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.outputs.outputs.backend }}
      frontend: ${{ steps.outputs.outputs.frontend }}
      gateway: ${{ steps.outputs.outputs.gateway }}
      compose: ${{ steps.outputs.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'data/**'
              - 'setup.cfg'
            frontend:
              - 'frontend/**'
            gateway:
              - 'nginx/**'
              - 'docs/**'
            compose:
              - 'docker-compose.production.yml'
      - name: Set change flags
        id: outputs
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.deploy_all }}" == "true" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "gateway=true" >> "$GITHUB_OUTPUT"
            echo "compose=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
            echo "gateway=${{ steps.filter.outputs.gateway }}" >> "$GITHUB_OUTPUT"
            echo "compose=${{ steps.filter.outputs.compose }}" >> "$GITHUB_OUTPUT"
          fi

  tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    services:
      postgres:
        image: postgres:15.4-alpine
        env:
          POSTGRES_USER: foodgram_user
          POSTGRES_PASSWORD: foodgram_password
          POSTGRES_DB: foodgram
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install flake8==7.3.0 flake8-isort==7.0.0
          pip install -r ./backend/requirements.txt
      - name: Test with flake8 and django tests
        env:
          POSTGRES_USER: foodgram_user
          POSTGRES_PASSWORD: foodgram_password
          POSTGRES_DB: foodgram
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          SECRET_KEY: test-secret-key
          DEBUG: 'True'
        run: |
          python -m flake8 backend/
          cd backend/
          python manage.py test

  build_and_push_to_docker_hub:
    name: Push backend Docker image to DockerHub
    runs-on: ubuntu-latest
    needs:
      - changes
      - tests
    if: |
      needs.changes.outputs.backend == 'true' &&
      needs.tests.result == 'success'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Prepare backend build context
        run: mkdir -p backend/data && cp data/ingredients.csv backend/data/
      - name: Push backend to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: ./backend/
          push: true
          tags: pmmage/foodgram_backend:latest

  build_frontend_and_push_to_docker_hub:
    name: Push frontend Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push frontend to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/
          push: true
          tags: pmmage/foodgram_frontend:latest

  build_gateway_and_push_to_docker_hub:
    name: Push gateway Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push gateway to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: pmmage/foodgram_gateway:latest

  deploy:
    runs-on: ubuntu-latest
    needs:
      - changes
      - build_and_push_to_docker_hub
      - build_frontend_and_push_to_docker_hub
      - build_gateway_and_push_to_docker_hub
    if: |
      always() &&
      !cancelled() &&
      (
        needs.build_and_push_to_docker_hub.result == 'success' ||
        needs.build_frontend_and_push_to_docker_hub.result == 'success' ||
        needs.build_gateway_and_push_to_docker_hub.result == 'success' ||
        needs.changes.outputs.compose == 'true'
      )
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Copy docker-compose.production.yml via ssh
        if: needs.changes.outputs.compose == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'docker-compose.production.yml,.env.example'
          target: 'foodgram'
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_BACKEND: ${{ needs.changes.outputs.backend == 'true' && needs.build_and_push_to_docker_hub.result == 'success' }}
          DEPLOY_FRONTEND: ${{ needs.changes.outputs.frontend == 'true' && needs.build_frontend_and_push_to_docker_hub.result == 'success' }}
          DEPLOY_GATEWAY: ${{ needs.changes.outputs.gateway == 'true' && needs.build_gateway_and_push_to_docker_hub.result == 'success' }}
          DEPLOY_COMPOSE: ${{ needs.changes.outputs.compose == 'true' }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_BACKEND,DEPLOY_FRONTEND,DEPLOY_GATEWAY,DEPLOY_COMPOSE
          script: |
            cd foodgram

            SERVICES=""
            if [ "$DEPLOY_BACKEND" = "true" ]; then
              SERVICES="$SERVICES backend"
            fi
            if [ "$DEPLOY_FRONTEND" = "true" ]; then
              SERVICES="$SERVICES frontend"
            fi
            if [ "$DEPLOY_GATEWAY" = "true" ]; then
              SERVICES="$SERVICES gateway"
            fi

            if [ -n "$SERVICES" ]; then
              sudo docker compose -f docker-compose.production.yml pull $SERVICES
              sudo docker compose -f docker-compose.production.yml up -d $SERVICES
            elif [ "$DEPLOY_COMPOSE" = "true" ]; then
              sudo docker compose -f docker-compose.production.yml up -d
            fi

            if [ "$DEPLOY_BACKEND" = "true" ]; then
              sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate
              sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --no-input
              sudo docker compose -f docker-compose.production.yml exec -T backend cp -r /app/collected_static/. /backend_static/
              sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py load_ingredients --path /data/ingredients.csv
            fi

            if [ "$DEPLOY_GATEWAY" = "true" ] || [ "$DEPLOY_COMPOSE" = "true" ]; then
              sudo nginx -t && sudo systemctl reload nginx
            fi

  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: Send message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: Деплой Foodgram успешно выполнен!
